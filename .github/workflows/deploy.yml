name: Deploy (manual)

# Enable after hosting credentials are configured.
# Uses the CI build artifact pattern — prefer promoting a green CI build.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-note:
    name: Deployment readiness gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy checklist reminder
        run: |
          echo "Before deploying to ${{ inputs.environment }}:"
          echo "1. Apply migrations 001–019 on the target Supabase project"
          echo "2. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (public only)"
          echo "3. Keep service_role / M-Pesa / email / SMS secrets on Edge Functions only"
          echo "4. Confirm CI (lint/test/build) is green on this commit"
          echo "5. See docs/operations/Deployment_Guide.md"
          echo "::notice::Configure actual deploy provider steps when ready."
