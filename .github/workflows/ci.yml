name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Placeholder public env for Vite (anon key is not a secret).
# Real project credentials belong in hosting / GitHub Environment secrets for deploy.
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  VITE_LOG_LEVEL: warn
  VITE_ERROR_PROVIDER: console

jobs:
  build-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate environment example
        run: |
          test -f .env.example
          grep -q 'VITE_SUPABASE_URL' .env.example
          grep -q 'VITE_SUPABASE_ANON_KEY' .env.example

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

